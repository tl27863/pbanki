[package]
name = "pbanki-core"
version.workspace = true
edition.workspace = true

[dependencies]
anki.workspace = true
anki_proto.workspace = true
slint = { workspace = true, features = ["unstable-fontique-011"] }
tokio = { workspace = true, features = ["rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
toml_edit = "0.23"
ttf-parser = "0.25"
# Font files are mapped, not read, when registered with Slint.
memmap2 = "0.9"
libc = "0.2"
tracing.workspace = true
tracing-subscriber.workspace = true
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-paint.workspace = true
blitz-traits.workspace = true
anyrender.workspace = true
anyrender_vello_cpu.workspace = true
parley.workspace = true
peniko.workspace = true
image.workspace = true

[features]
default = []
# Timing instrumentation (`[profile]` log lines) and the background font probe.
profile = []

[build-dependencies]
slint-build.workspace = true
