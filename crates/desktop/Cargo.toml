[package]
name = "pbanki-desktop"
version.workspace = true
edition.workspace = true

[dependencies]
pbanki-core.workspace = true
slint = { workspace = true, features = ["backend-winit"] }
tokio.workspace = true
tracing.workspace = true
# eink-sim: the PocketBook backend over a simulated e-ink panel. The SDK
# bindings are compiled but libinkview.so is never loaded.
inkview = { workspace = true, optional = true, features = ["sdk-6-10"] }
inkview-slint = { workspace = true, optional = true, features = ["sdk-6-10"] }
minifb = { version = "0.29", optional = true, default-features = false, features = ["x11"] }

[features]
default = []
profile = ["pbanki-core/profile"]
# Simulated e-ink display (update latency, gray levels, flashes) driven by the
# same inkview-slint presenter as the device: `cargo run --features eink-sim`.
eink-sim = ["dep:inkview", "dep:inkview-slint", "dep:minifb"]
