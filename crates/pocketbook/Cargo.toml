[package]
name = "pbanki"
version.workspace = true
edition.workspace = true

[dependencies]
euclid = "0.22.11"
rgb = "0.8.52"
pbanki-core.workspace = true
slint.workspace = true
inkview.workspace = true
inkview-slint.workspace = true
tokio.workspace = true
# Not used directly: makes Slint's fontique load libfontconfig at runtime
# instead of linking it, so the armv7 cross build needs no fontconfig sysroot.
# Without the library on the device, system fonts are skipped and the UI falls
# back to the card fonts registered by `register_catalog_fonts`.
fontique = { version = "0.11", features = ["fontconfig-dlopen"] }

[features]
default = []
sdk-6-8 = ["inkview/sdk-6-8"]
profile = ["pbanki-core/profile"]
