id: pbanki-checkbox-font-size
valid:
  - |
    component A {
        cb := CheckBox {
            text: "x";
            font-size: 12px;
        }
    }
  - |
    component A {
        if x: CheckBox { font-size: 12px; text: "y"; }
    }
invalid:
  - |
    component A {
        cb := CheckBox {
            text: "x";
        }
    }
  - |
    component A {
        if x: CheckBox { text: "y"; }
    }
  - |
    component A {
        CheckBox {
            text: "x";
            Text { font-size: 12px; }
        }
    }
