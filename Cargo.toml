[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop", "crates/pocketbook"]
# A plain `cargo build`/`cargo test`/`cargo run` on the host covers the core
# library and the desktop frontend (the only binary, so `cargo run` starts it).
# The PocketBook build always selects `-p pbanki` (see the Makefile), so the
# desktop's winit features are never unified into the ARM build.
default-members = ["crates/core", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
pbanki-core = { path = "crates/core" }
anki = { git = "https://github.com/ankitects/anki", branch = "main" }
anki_proto = { git = "https://github.com/ankitects/anki", branch = "main" }
# Every member must use the same Slint; two copies fail at `set_platform`.
# Members add their backend and renderer features on top.
slint = { version = "1.18.1", default-features = false, features = ["compat-1-2", "std", "software-renderer-systemfonts", "renderer-software"] }
slint-build = "1.18.1"
inkview = { git = "https://github.com/tl27863/inkview-rs", branch = "pbanki-device-panel", default-features = false }
inkview-slint = { git = "https://github.com/tl27863/inkview-rs", branch = "pbanki-device-panel", default-features = false }
tokio = { version = "1", features = ["io-util"] }
# Card rendering (notes/blitz-card-render.md). Keep this revision equal to the
# one in bench/blitz-render/Cargo.toml and update both together. The other
# versions are the ones Blitz uses at this revision.
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "d0f48bd17224130c3697b9c6a2de9c090cfdebc7", default-features = false, features = ["svg"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "d0f48bd17224130c3697b9c6a2de9c090cfdebc7" }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "d0f48bd17224130c3697b9c6a2de9c090cfdebc7", default-features = false, features = ["svg"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "d0f48bd17224130c3697b9c6a2de9c090cfdebc7" }
anyrender = "0.14.0"
anyrender_vello_cpu = "0.18.0"
parley = { version = "0.12", default-features = false, features = ["std"] }
peniko = "0.6.0"
# blitz-dom decodes <img> with `image` but enables no formats itself. `pnm`
# is for the image cache: decoded images reach Blitz as PAM (card_render/image_cache.rs).
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "pnm"] }
# Logging. anki already depends on both (same versions and features), so they
# add no crates. pbanki_core::logging installs the subscriber.
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug-assertions = false
incremental = false

[profile.release.package."*"]
opt-level = 3
overflow-checks = false

# Host measurements (crates/core/examples/render_deck.rs): optimized like the
# release, but without fat LTO, so it builds in a fraction of the time.
[profile.host-bench]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
